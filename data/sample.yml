# Sample data for the 10&5 Hospitality demo. Every restaurant, visit and note
# here is invented. Each visit lists only what it did not pass: `missed`
# (a failed standard and the evaluator's note), `na` (not observed on this
# visit) and `notes` (a note on a standard that passed). Every other
# standard passed.
departments:
- key: host
  name: Host
  standards:
  - id: h1
    text: Greeted the party within 30 seconds of arrival
  - id: h2
    text: Made eye contact and smiled during the greeting
  - id: h3
    text: Offered to check coats or bags
  - id: h4
    text: Quoted an accurate wait time
  - id: h5
    text: Walked the party to the table at their pace
  - id: h6
    text: Thanked the party and invited them back on the way out
- key: bartender
  name: Bartender
  standards:
  - id: b1
    text: Acknowledged guests at the bar within one minute
  - id: b2
    text: Offered a drink list or made a recommendation
  - id: b3
    text: Measured every pour
  - id: b4
    text: Kept the bar top clean and dry
  - id: b5
    text: Offered water alongside alcoholic drinks
  - id: b6
    text: Closed out the tab promptly when asked
- key: server
  name: Server
  standards:
  - id: s1
    text: Approached the table within two minutes of seating
  - id: s2
    text: Introduced themselves by name
  - id: s3
    text: Described a special or signature dish
  - id: s4
    text: Asked about allergies or dietary needs
  - id: s5
    text: Checked back within two bites or two minutes of the entrees
  - id: s6
    text: Cleared plates only once everyone had finished
  - id: s7
    text: Offered dessert or coffee
  - id: s8
    text: Delivered the check within five minutes of the request
- key: manager
  name: Manager
  standards:
  - id: m1
    text: Visible in the dining room during service
  - id: m2
    text: Stopped by the table to ask about the experience
  - id: m3
    text: Staff in clean, complete uniforms
  - id: m4
    text: Restrooms clean and stocked
  - id: m5
    text: Resolved a problem without being asked twice
